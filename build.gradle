buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/'}
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.+', changing: true
    }
}
apply plugin: 'net.minecraftforge.gradle'

group = 'chaosinventory'
version = '1.0.0'
archivesBaseName = 'chaosinventory'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'


runs {
    client {
        workingDirectory project.file('run')
        property 'forge.logging.mojang_level', 'info'
        mods {
            chaosinventory {
                source sourceSets.main
            }
        }
    }

    server {
        workingDirectory project.file('run')
        property 'forge.logging.mojang_level', 'info'
        mods {
            chaosinventory {
                source sourceSets.main
            }
        }
    }
}
    dependencies {
        minecraft 'net.minecraftforge:forge:1.20.1-47.4.1'
    }

    jar {
        manifest {
            attributes([
                    "Specification-Title"     : "chaosinventory",
                    "Specification-Vendor"    : "chaos",
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.version,
                    "Implementation-Vendor"   : "chaos",
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
            ])
        }
    }
}